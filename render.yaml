services:
  # ── Backend: Node.js Web Service ─────────────────────────────────────────────
  - type: web
    name: tsams-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        sync: false          # set in Render dashboard
      - key: CORS_ORIGIN
        sync: false          # set to frontend URL after frontend deploys

  # ── Frontend: Static Site ─────────────────────────────────────────────────────
  - type: web
    name: tsams-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to: https://tsams-backend.onrender.com/api
