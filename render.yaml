services:
  - type: web
    name: tsams-app
    runtime: node
    buildCommand: npm install && npm run build && cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
